trigger: none
pr: none

parameters:
- name: cloud
  displayName: 'Azure cloud'
  type: string
  default: 'Commercial'
  values:
  - Commercial
  - Government
- name: serviceTag
  displayName: 'Service tag (exact name in selected cloud)'
  type: string
  default: 'LogicApps'

schedules:
- cron: '0 3 * * *'         # nightly at 03:00 UTC
  displayName: Nightly - 03:00 UTC
  branches:
    include:
      - main
  always: true

variables:
  - name: azureSubscription
    value: 'MyAzureServiceConnection'   # replace with your Azure service connection name in DevOps
  - name: logicAppResourceId
    value: '/subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Web/sites/<logicAppName>'
  - name: apiVersion
    value: '2021-02-01'
  - name: includeContentAccess
    value: 'false'   # set to 'true' to also update contents access control (Consumption workflows)

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self
  clean: true

- task: AzureCLI@2
  displayName: 'Update Logic App access restrictions (Standard or Consumption)'
  inputs:
    azureSubscription: '$(azureSubscription)'
    scriptType: 'pscore'
    scriptLocation: 'inlineScript'
    inlineScript: |
      $ErrorActionPreference = 'Stop'
      Write-Host "Running access update script (idempotent)"
      $include = "$(includeContentAccess)"
      $scriptParams = @{
        LogicAppResourceId = "$(logicAppResourceId)"
        ServiceTag = $env:SERVICE_TAG
        Cloud = $env:AZURE_CLOUD
        ApiVersion = "$(apiVersion)"
        IncludeContentAccess = ($include -and $include.ToLower() -eq 'true')
      }
      # Execute (Consumption uses full PUT; Standard uses PUT web config)
      .\scripts\patch-logicapp-access.ps1 @scriptParams
  env:
    AZURE_CLOUD: ${{ parameters.cloud }}
    SERVICE_TAG: ${{ parameters.serviceTag }}
    AZURE_HTTP_USER_AGENT: 'azure-pipelines-nightly-patch'
